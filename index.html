<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0D2847">
  <title>Mark Gillespie · Tokyo Dec 2026 · Happy Camper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Palette is hardcoded as hex throughout (iOS Safari var() safety). Tokens kept for reference only. */
    :root{--font-serif:'Cormorant Garamond','Palatino Linotype',Georgia,serif;--font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%;height:100%;background-color:#FAF8F4}
    body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background-color:#FAF8F4;color:#0A1A2F;line-height:1.55;-webkit-font-smoothing:antialiased;height:100%;margin:0;padding:0}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    input{font-family:inherit}

    /* ── HEADER ── */
    #app-header{position:fixed;top:0;left:0;right:0;z-index:9999;background-color:#0D2847;background-image:linear-gradient(160deg,#0F3160 0%,#0D2847 55%,#071B35 100%);border-bottom:1px solid rgba(255,255,255,.08)}
    .hdr-top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px}
    .hdr-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .hdr-flag{font-size:17px}
    .hdr-dest{font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;font-weight:300;letter-spacing:.4px;color:#fff;white-space:nowrap}
    .hdr-hc{font-size:8px;color:rgba(255,255,255,.40);letter-spacing:.8px;text-transform:uppercase;margin-top:1px}
    .hdr-names{text-align:center;padding:0 14px 7px;border-bottom:1px solid rgba(255,255,255,.06)}
    .hdr-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(22px,5vw,34px);font-weight:300;letter-spacing:.4px;color:#fff;line-height:1.15}
    .hdr-name2{font-size:clamp(9px,1.8vw,11px);color:rgba(255,255,255,.45);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
    .hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
    #jst-clock{font-family:'SF Mono',Menlo,monospace;font-size:14px;font-weight:300;letter-spacing:1px;color:#fff;display:block;text-align:right;white-space:nowrap}
    #trip-day-label{font-size:8.5px;color:rgba(255,255,255,.38);letter-spacing:.4px;margin-top:1px;display:block;text-align:right;white-space:nowrap}

    /* ── TAB NAV ── */
    .tab-nav{display:flex;border-top:1px solid rgba(255,255,255,.07);overflow-x:auto;scrollbar-width:none}
    .tab-nav::-webkit-scrollbar{display:none}
    .tab-btn{flex-shrink:0;background:transparent!important;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.42)!important;font-size:10.5px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;padding:9px 13px 7px;white-space:nowrap}
    .tab-btn.active{color:#E8A4B2!important;border-bottom-color:#E8A4B2!important}

    /* ── MAIN ── */
    #main-content{overflow-y:auto;-webkit-overflow-scrolling:touch;height:100vh;background-color:#FAF8F4}
    .tab-panel{display:none;padding:14px 14px 80px;background-color:#FAF8F4;animation:panelFade .22s ease both}
    .tab-panel.active{display:block}
    @keyframes panelFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* ── BANNER ── */
    .trip-banner,.disc-banner{background-color:#0D2847;background-image:linear-gradient(135deg,#0D2847 0%,#0A2040 55%,#04111F 100%);border-radius:18px;padding:22px 20px 20px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
    .trip-banner-kana{font-family:'Cormorant Garamond',Georgia,serif;font-size:11px;font-style:italic;opacity:.55;letter-spacing:1px;margin-bottom:4px}
    .trip-banner h2,.disc-banner h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:300;letter-spacing:1px;margin-bottom:4px}
    .banner-dates{font-size:13px;opacity:.72}
    .disc-banner p{font-size:12px;opacity:.65}
    .banner-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
    .banner-chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:11px}
    .section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:#90A8BE;padding:8px 2px 6px}

    /* ── LEGEND ── */
    .booking-legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;background-color:#FFFFFF;border-radius:12px;margin-bottom:10px;border:1px solid #EBF2FA}
    .bl-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#5A7590;font-weight:500}
    .bl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
    .bl-dot.confirmed{background:#C8E6C9;border:1px solid rgba(27,94,32,.3)}
    .bl-dot.requested{background:#80DEEA;border:1px solid rgba(0,77,86,.3)}
    .bl-dot.self-booked{background:#FADADD;border:1px solid rgba(123,26,26,.3)}
    .bl-dot.suggestion{background:#BBDEFB;border:1px solid rgba(13,60,110,.3)}
    .bl-dot.walk-in{background:#FFF9E6;border:1px solid rgba(107,80,0,.3)}
    .bl-dot.pending{background:#ECEFF1;border:1px solid rgba(84,110,122,.3)}

    /* ── DAY CARDS ── */
    .day-card{background-color:#FFFFFF;border-radius:18px;margin-bottom:10px;box-shadow:0 2px 12px rgba(13,40,71,.10),0 1px 3px rgba(13,40,71,.06);overflow:hidden;border:1px solid #EBF2FA;animation:cardIn .28s ease both}
    @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .day-card.is-today{border-color:#0D2847;box-shadow:0 0 0 1.5px #0D2847,0 2px 12px rgba(13,40,71,.10)}
    .day-card.is-past{opacity:.58}
    .day-card.is-tbc{background-color:#F7F9FC;border-style:dashed;border-color:#C9D6E4}
    .day-header{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    .day-num{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background-color:#EBF2FA;color:#5A7590}
    .day-card.is-today .day-num{background-color:#0D2847;color:#fff}
    .day-card.has-feature .day-num{background-color:#FBF5E6;color:#B07C22;border:1px solid rgba(176,124,34,.3)}
    .day-header-info{flex:1;min-width:0}
    .day-name{font-size:15px;font-weight:600;color:#0A1A2F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .day-sub{font-size:11px;color:#90A8BE;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .day-city-badge{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:#EBF3FF;color:#1A5FAA}
    .today-pill{font-size:10px;font-weight:700;background:#0D2847;color:#fff;padding:2px 8px;border-radius:20px}
    .occasion-pill{font-size:10px;font-weight:600;background:#FDF2F5;color:#A6455C;padding:2px 8px;border-radius:20px;border:1px solid rgba(166,69,92,.2)}
    .day-chevron{color:#90A8BE;font-size:14px;flex-shrink:0;transition:transform .25s cubic-bezier(.4,0,.2,1)}
    .day-card.open .day-chevron{transform:rotate(180deg)}
    .day-body{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1)}
    .day-card.open .day-body{max-height:5000px}
    .day-body-inner{padding:0 16px 16px}

    .hotel-bar{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 13px;margin-bottom:12px;background:#EBF4FF;border-left:3px solid #0D2847}
    .hotel-bar.tbc{background:#F3F5F7;border-left-color:#90A4AE}
    .hb-name{font-size:12px;font-weight:600;color:#0D2847}
    .hb-detail{font-size:11px;color:#1A3F6F;margin-top:1px}
    .day-note-bar{background:#EEF4FF;border-radius:12px;border-left:3px solid #4A80C0;padding:10px 13px;font-size:12px;color:#233D5C;line-height:1.55;margin-bottom:12px}

    .weather-widget{display:flex;align-items:center;gap:10px;background:#FBF5E6;border-radius:12px;border:1px solid rgba(176,124,34,.15);padding:10px 13px;margin-bottom:14px}
    .wx-icon{font-size:26px}.wx-info{flex:1}.wx-temp{font-size:14px;font-weight:600}.wx-desc{font-size:11px;color:#5A7590;margin-top:2px}.wx-rain{font-size:12px;font-weight:500;color:#1D6FAD;flex-shrink:0}

    /* ── TIMELINE ── */
    .timeline{position:relative;padding-left:75px}
    .stop-item{position:relative;margin-bottom:14px}
    .stop-item::after{content:'';position:absolute;left:-16px;top:29px;bottom:-14px;width:2px;background:#D8E4F0;z-index:1}
    .stop-item:last-child::after{display:none}
    .stop-time{position:absolute;left:-70px;top:11px;width:42px;text-align:right;font-size:10px;font-weight:600;color:#90A8BE;line-height:1.4}
    .stop-dot{position:absolute;left:-25px;top:9px;width:18px;height:18px;border-radius:50%;border:2.5px solid #ccc;background:#fff;z-index:2}
    .stop-dot.t-restaurant{border-color:#8B1A1A;background:#F8EDED}
    .stop-dot.t-transport{border-color:#0D2847;background:#EEF4FF}
    .stop-dot.t-flight{border-color:#0277BD;background:#E1F5FE}
    .stop-dot.t-pending{border-color:#607D8B;background:#ECEFF1}
    .stop-card{background-color:#FAF8F4;border-radius:12px;border:1px solid #EBF2FA;padding:11px 13px}
    .stop-card.is-pending{background-color:#F5F5F5;border-color:rgba(96,125,139,.15)}
    .stop-card.is-feature{background-color:#FFFFFF;border-color:rgba(176,124,34,.28);box-shadow:0 1px 6px rgba(176,124,34,.08)}
    .stop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .stop-title-wrap{flex:1;min-width:0}
    .stop-icon{font-size:13px;margin-right:5px}
    .stop-title{font-size:14px;font-weight:600;color:#0A1A2F;line-height:1.3}
    .stop-card.is-feature .stop-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:600;letter-spacing:.2px}
    .stop-subtitle{font-size:11px;color:#5A7590;margin-top:2px}
    .stop-badge{font-size:9.5px;font-weight:600;padding:3px 9px;border-radius:5px;flex-shrink:0;white-space:nowrap}
    .stop-badge.confirmed{background:#C8E6C9;color:#1B5E20;border:1px solid rgba(27,94,32,.18)}
    .stop-badge.requested{background:#80DEEA;color:#004D56;border:1px solid rgba(0,77,86,.18)}
    .stop-badge.pending{background:#ECEFF1;color:#546E7A;border:1px solid rgba(84,110,122,.2)}
    .stop-badge.logistics{background:#FFE0B2;color:#BF360C;border:1px solid rgba(191,54,12,.18)}
    .stop-facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
    .fact{font-size:10.5px;font-weight:500;color:#233D5C;background:#EEF4FF;border-radius:6px;padding:3px 8px}
    .fact.gold{background:#FBF5E6;color:#8A5E12}
    .stop-notes{font-size:12.5px;color:#233D5C;line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid #EBF2FA}
    .stop-alert{display:flex;align-items:flex-start;gap:6px;margin-top:8px;padding:7px 10px;background:#FFFBEB;border-radius:8px;border-left:3px solid #F59E0B;font-size:11px;color:#92400E;font-weight:500;line-height:1.4}
    .assume{font-size:10px;color:#90A8BE;font-style:italic;margin-top:6px}
    .map-actions{display:flex;gap:5px;margin-top:10px}
    .map-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 5px;border-radius:8px;font-size:11px;font-weight:500;min-height:38px;border:1px solid #D8E4F0!important;background-color:#FFFFFF!important;color:#233D5C!important}
    .map-btn:active{transform:scale(.96)}
    .map-btn.mp{background-color:#0D2847!important;color:#FFFFFF!important;border-color:#0D2847!important;font-weight:600}
    .map-btn.taxi{background-color:#FBF5E6!important;color:#8A5E12!important;border-color:rgba(176,124,34,.3)!important}

    /* ── UTILITIES ── */
    .util-card{background-color:#FFFFFF;border-radius:18px;padding:18px;box-shadow:0 2px 12px rgba(13,40,71,.10);border:1px solid #EBF2FA;margin-bottom:12px}
    .util-card-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:400;color:#0A1A2F;margin-bottom:14px;letter-spacing:.3px}
    .fx-row{display:flex;gap:8px;align-items:flex-end}
    .fx-group{flex:1;min-width:0}
    .fx-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#90A8BE;margin-bottom:5px}
    .fx-input{width:100%;padding:10px 12px;border:1.5px solid #D8E4F0;border-radius:8px;font-size:18px;font-weight:500;color:#0A1A2F;background-color:#FAF8F4;outline:none;-webkit-appearance:none}
    .fx-input:focus{border-color:#0D2847}
    .fx-swap-btn{width:40px;height:40px;border-radius:50%;background-color:#EEF4FF!important;border:none;color:#0D2847!important;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .fx-rate-note{font-size:11px;color:#90A8BE;text-align:center;margin-top:10px;line-height:1.5}
    .info-list{list-style:none}
    .info-list li{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid #EBF2FA;font-size:13px;line-height:1.55}
    .info-list li:last-child{border-bottom:none;padding-bottom:0}
    .info-emoji{font-size:17px;flex-shrink:0;margin-top:1px}
    .info-text{color:#233D5C}
    .info-text strong{color:#0A1A2F;display:block;margin-bottom:1px}
    .rule-item{padding:9px 0;border-bottom:1px solid #EBF2FA;display:flex;gap:10px;font-size:12.5px;line-height:1.5;color:#233D5C}
    .rule-item:last-child{border-bottom:none}
    .rule-icon{font-size:15px;flex-shrink:0;margin-top:1px}
    .rule-text strong{color:#0A1A2F;display:block}
    .rule-item.critical{background:#FFF5F5;margin:0 -18px;padding:12px 18px;border-left:3px solid #C62828}

    /* ── TABLES (reservations list) ── */
    .res-card{background-color:#FFFFFF;border-radius:18px;margin-bottom:10px;box-shadow:0 2px 12px rgba(13,40,71,.10);border:1px solid rgba(27,94,32,.22);overflow:hidden}
    .res-row{display:flex;align-items:center;gap:14px;padding:14px 16px}
    .res-row+.res-row{border-top:1px solid #EBF2FA}
    .res-date{width:58px;text-align:center;flex-shrink:0}
    .res-date-d{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600;color:#0D2847;line-height:1}
    .res-date-m{font-size:9px;font-weight:600;letter-spacing:.6px;white-space:nowrap;text-transform:uppercase;color:#90A8BE;margin-top:2px}
    .res-info{flex:1;min-width:0}
    .res-name{font-size:15px;font-weight:600;color:#0A1A2F}
    .res-meta{font-size:11px;color:#5A7590;margin-top:2px}
    .res-map{padding:8px 12px;border-radius:8px;font-size:13px;border:1px solid #D8E4F0;background-color:#FFFFFF;color:#233D5C}

    /* ── DISCOVER ── */
    .disc-feature{background-color:#0D2847;background-image:linear-gradient(180deg,#0D2847 0%,#142647 100%);color:#f3eee0;border-radius:18px;padding:22px 20px 20px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid rgba(176,124,34,.2)}
    .disc-feature.plum{background-color:#1a0f2e;background-image:linear-gradient(180deg,#1a0f2e 0%,#2d1b47 100%)}
    .disc-feature-label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#B07C22;font-weight:600;margin-bottom:12px}
    .disc-feature-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:300;margin:0 0 4px;color:#f3eee0}
    .disc-feature-by{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px;color:#B07C22;margin-bottom:14px}
    .disc-feature-p{font-size:13px;line-height:1.6;color:rgba(243,238,224,.78);margin:0 0 16px}
    .disc-feature-cta{display:inline-flex;align-items:center;gap:6px;background-color:#B07C22!important;color:#0D2847!important;padding:10px 18px;border-radius:99px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
    .disc-feature-ig{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border-radius:99px;font-size:11.5px;font-weight:600;color:#f3eee0!important;border:1px solid rgba(244,229,191,.3)}
    .disc-card{background-color:#FFFFFF;border:1px solid #EBF2FA;border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 12px rgba(13,40,71,.10)}
    .disc-card-head{padding:14px 18px 10px;border-bottom:1px solid #EBF2FA}
    .disc-card-head-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:500;color:#0A1A2F}
    .disc-card-body{padding:8px 12px 12px}
    .disc-item{display:flex;align-items:center;gap:12px;padding:10px;background-color:#F5F2EE;border-radius:10px;margin-bottom:6px;border:1px solid #EBF2FA}
    .disc-item:last-child{margin-bottom:0}
    .disc-item-info{flex:1;min-width:0}
    .disc-item-name{font-size:13.5px;font-weight:600;color:#0A1A2F;line-height:1.25}
    .disc-item-sub{font-size:11px;color:#5A7590;margin-top:2px;font-style:italic}
    .disc-arrow{font-size:16px;color:#B07C22;flex-shrink:0}

    /* ── EMERGENCY ── */
    .emergency-banner{background-color:#0D2847;border-radius:18px;padding:18px 20px;color:#fff;margin-bottom:14px;text-align:center}
    .emergency-banner h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:300;margin-bottom:4px}
    .emergency-banner p{font-size:12px;opacity:.75}
    .contact-card{background-color:#FFFFFF;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(13,40,71,.10);border:1px solid #EBF2FA;margin-bottom:12px}
    .contact-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #EBF2FA;gap:10px}
    .contact-row:last-child{border-bottom:none}
    .contact-left{display:flex;align-items:center;gap:12px;min-width:0}
    .contact-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
    .ci-r{background:#FFEBEE}.ci-b{background:#E3F2FD}.ci-n{background:#EEF4FF}.ci-o{background:#FFF3E0}
    .contact-label{font-size:13px;font-weight:600;color:#0A1A2F}
    .contact-sub{font-size:11.5px;color:#5A7590;margin-top:1px}
    .call-btn{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;border:none;flex-shrink:0}
    .cn{background-color:#0D2847!important;color:#fff!important}.cr{background-color:#C62828!important;color:#fff!important}.cb{background-color:#0277BD!important;color:#fff!important}

    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(13,40,71,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;pointer-events:none;opacity:0;transition:all .22s cubic-bezier(.4,0,.2,1);z-index:99999;white-space:nowrap;max-width:90vw}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(min-width:700px){
      .tab-nav{padding:0 30px}
      .tab-btn{font-size:12px;padding:10px 18px}
      .tab-panel{max-width:900px;margin-left:auto;margin-right:auto;padding:24px 32px 60px}
    }
  </style>
</head>
<body style="background-color:#FAF8F4">

<header id="app-header" style="position:fixed;top:0;left:0;right:0;z-index:9999;background-color:#0D2847;background-image:linear-gradient(160deg,#0F3160 0%,#0D2847 55%,#071B35 100%);">
  <div class="hdr-top">
    <div class="hdr-left">
      <span class="hdr-flag">🗾</span>
      <div>
        <div class="hdr-dest">Tokyo · December 2026</div>
        <div class="hdr-hc">Happy Camper · v1</div>
      </div>
    </div>
    <div class="hdr-right">

/* ══════════════ HELPERS ══════════════ */
function esc(s){if(s===null||s===undefined)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function gm(q,link){if(link)return link;return(q&&q.indexOf('http')===0)?q:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'Tokyo Japan');}
function nav(q){return'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(q||'Tokyo Japan');}
function uber(q){return'https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[formatted_address]='+encodeURIComponent(q);}

var toastTm;
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTm);toastTm=setTimeout(function(){el.classList.remove('show');},2200);}
function copyText(txt){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){showToast('Copied');},function(){fallbackCopy(txt);});}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);showToast('Copied');}
window.copyAddr=function(di,si){var s=TRIP.days[di].stops[si];if(s&&s.q)copyText(s.q);};

/* ══════════════ CLOCK ══════════════ */
function jst(){return new Date(Date.now()+9*3600000);}
function isoToday(){return jst().toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000);}
function tickClock(){
  var d=jst();
  document.getElementById('jst-clock').textContent=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  var today=d.toISOString().slice(0,10);
  var lbl=document.getElementById('trip-day-label');
  if(today<TRIP.startDate){var n=daysBetween(today,TRIP.startDate);lbl.textContent=n+(n===1?' day':' days')+' to Tokyo';}
  else if(TRIP.endDate&&today>TRIP.endDate){lbl.textContent='Journey complete · Sayonara!';}
  else{lbl.textContent='Day '+(daysBetween(TRIP.startDate,today)+1)+' · Tokyo';}
}

/* ══════════════ WEATHER ══════════════ */
function wmo(c){
  if(c===0)return{i:'☀️',d:'Clear sky'};
  if(c<=2)return{i:'⛅',d:'Partly cloudy'};
  if(c===3)return{i:'☁️',d:'Overcast'};
  if(c>=45&&c<=48)return{i:'🌫️',d:'Foggy'};
  if(c>=51&&c<=67)return{i:'🌧️',d:'Rain'};
  if(c>=71&&c<=77)return{i:'🌨️',d:'Snow'};
  if(c>=80&&c<=82)return{i:'🌦️',d:'Showers'};
  if(c>=95)return{i:'⛈️',d:'Thunderstorm'};
  return{i:'🌤️',d:'Mixed'};
}
function wxFallback(){
  return '<span class="wx-icon">❄️</span><div class="wx-info"><div class="wx-temp" style="font-size:13px">December Tokyo · typically 3–12°C</div><div class="wx-desc">Dry, bright and cold · live forecast appears ~2 weeks out</div></div>';
}
function loadWeather(){
  var url='https://api.open-meteo.com/v1/forecast?latitude='+WX_LAT+'&longitude='+WX_LNG+'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Asia%2FTokyo&forecast_days=16';
  fetch(url).then(function(r){return r.json();}).then(function(data){
    if(!data||!data.daily)return;
    data.daily.time.forEach(function(date,i){
      var el=document.getElementById('wx-'+date);if(!el)return;
      var e=wmo(data.daily.weathercode[i]);
      var hi=Math.round(data.daily.temperature_2m_max[i]),lo=Math.round(data.daily.temperature_2m_min[i]);
      var rain=data.daily.precipitation_probability_max[i]||0;
      el.innerHTML='<span class="wx-icon">'+e.i+'</span><div class="wx-info"><div class="wx-temp">'+hi+'° / '+lo+'°C · '+e.d+'</div><div class="wx-desc">Tokyo · live forecast</div></div><div class="wx-rain">💧 '+rain+'%</div>';
    });
  }).catch(function(){});
}

function renderStop(stop,di,si){

      +'<a href="'+nav(stop.q)+'" target="_blank" rel="noopener" class="map-btn" aria-label="Directions to '+esc(stop.title)+'">🧭 Nav</a>'
      +(stop.taxi?'<a href="'+uber(stop.q)+'" target="_blank" rel="noopener" class="map-btn taxi" aria-label="Taxi to '+esc(stop.title)+'">🚕 Taxi</a>':'')

    +'<div class="rule-item"><span class="rule-icon">📷</span><div class="rule-text"><strong>Ask before photographing</strong>Some counters don’t allow photos. When they do, keep it quick and discreet.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">💰</span><div class="rule-text"><strong>No tipping</strong>Tipping isn’t done in Japan. Say <em>Gochisousama deshita</em> to the chef after the meal instead.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">🔒</span><div class="rule-text"><strong>Reservations are firm</strong>Happy Camper’s access is built on years of trust. Once confirmed, a reservation is a commitment.</div></div>'
    +'</div>';
  var j=document.getElementById('fx-jpy'),u=document.getElementById('fx-usd');
  function fJ(){var v=parseFloat(j.value);u.value=isNaN(v)?'':(v/FX_RATE).toFixed(2);}
  function fU(){var v=parseFloat(u.value);j.value=isNaN(v)?'':String(Math.round(v*FX_RATE));}
  j.addEventListener('input',fJ);u.addEventListener('input',fU);
  document.getElementById('fx-swap').addEventListener('click',function(){j.value='10000';fJ();});
  fJ();
}

/* ══════════════ TABS + INIT ══════════════ */
document.querySelector('.tab-nav').addEventListener('click',function(e){
  var btn=e.target.closest('.tab-btn');if(!btn)return;
  var name=btn.getAttribute('data-tab');
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===name);});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.id==='tab-'+name);});
  document.getElementById('main-content').scrollTop=0;
});
function fixHeaderOffset(){var h=document.getElementById('app-header'),m=document.getElementById('main-content');if(h&&m)m.style.paddingTop=h.offsetHeight+'px';}
function safe(fn,name){try{fn();}catch(e){console.error(name+' error:',e);}}
function init(){
  safe(renderItinerary,'Itinerary');safe(renderTables,'Tables');safe(renderDiscover,'Discover');
  safe(renderUtilities,'Utilities');safe(renderEmergency,'Emergency');
  safe(tickClock,'Clock');setInterval(function(){safe(tickClock,'Clock');},1000);
  fixHeaderOffset();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
window.addEventListener('resize',fixHeaderOffset);
window.addEventListener('load',fixHeaderOffset);
}());
</script>
